# Compila la app y la publica en Firebase.
#  - Pull request: URL de vista previa (canal temporal de 7 días) comentada en el PR.
#  - Push a main: despliegue en producción (Hosting + reglas de Firestore).
#
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT en GitHub (JSON de la cuenta firebase-adminsdk-fbsvc con los roles Administrador de Firebase y Consumidor de Service Usage).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: mimagia-app
          expires: 7d

  live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Desplegar en Firebase
        run: npx --yes firebase-tools@latest deploy --only hosting,firestore --project mimagia-app --non-interactive
